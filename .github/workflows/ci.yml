name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 最小权限：CI 只读仓库内容，从不写回、从不发布。
permissions:
  contents: read

jobs:
  source-verify:
    name: Source verification (Windows, Node ${{ matrix.node-version }}, PS ${{ matrix.ps }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
        # ps = '7' → PowerShell 7 (fast, best diagnostics);
        # ps = '5.1' → Windows PowerShell 5.1, the shell a new user actually
        # runs install.ps1 with. Note: the step `shell:` input does NOT accept
        # expressions (matrix context unavailable there), so the host is chosen
        # in `run` below with a static `shell: pwsh` wrapper.
        ps: ['7', '5.1']
    steps:
      - name: Checkout
        # v7 — 固定完整 commit SHA（供应链安全），精确版本见行尾注释
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 不需要写权限；禁用 GIT 凭据持久化，防止任何 step 意外使用仓库令牌推送
          persist-credentials: false

      - name: Setup Node
        # v7 — 固定完整 commit SHA（供应链安全），精确版本见行尾注释
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show toolchain
        shell: pwsh
        run: |
          node --version
          $PSVersionTable.PSVersion.ToString()
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Reproducible lockfile check (skill, no lifecycle scripts)
        shell: pwsh
        working-directory: skill
        # 验证 package-lock.json 与 package.json 一致且可用官方 registry 复现；
        # --ignore-scripts 禁止任何依赖生命周期脚本（sharp 的 postinstall 不执行）。
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Runtime undefined-symbol lint
        shell: pwsh
        working-directory: skill
        run: npm run lint

      - name: Source tests + installer lifecycle (verify.ps1 -SourceOnly)
        shell: pwsh
        run: |
          if ("${{ matrix.ps }}" -eq "5.1") {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./verify.ps1 -SourceOnly
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            ./verify.ps1 -SourceOnly
          }
